name: Update Complete TODO List

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-readme-todos.yml
      - .github/scripts/update_readme_todos.py
  workflow_dispatch:
    inputs:
      apply:
        description: Write README and push the documentation commit
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-todo-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # First bootstrap run is an auditable dry run. Flip to true to commit.
      APPLY: "false"
      BASE_REF: origin/main
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate parser and prepare README update
        id: update
        run: python .github/scripts/update_readme_todos.py

      - name: Commit README update and remove temporary automation
        if: env.APPLY == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "No README changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm -r --ignore-unmatch \
            .github/workflows/update-readme-todos.yml \
            .github/scripts/update_readme_todos.py
          git commit -m "docs(readme): update Complete TODO List on dev"
          git push origin HEAD:dev
