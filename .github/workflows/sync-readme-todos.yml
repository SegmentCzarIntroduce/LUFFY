name: Sync README TODO list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete temporary branch and remove this workflow from main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete todo-readme-sync-temp || echo "temporary branch already absent"
          git rm -f .github/workflows/sync-readme-todos.yml
          git commit -m "chore: remove temporary TODO sync workflow"
          git push origin HEAD:main
