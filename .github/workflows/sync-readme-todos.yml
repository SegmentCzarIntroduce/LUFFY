name: Sync README TODO list

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Extract TODOs and update README
        id: update
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path(".github/scripts/sync_readme_todos.py")
          s = p.read_text()
          old = 'if x.endswith(".py"))'
          new = 'if x.endswith(".py") and not x.startswith(".github/"))'
          assert old in s, "expected changed-file filter not found"
          p.write_text(s.replace(old, new))
          PY
          python3 .github/scripts/sync_readme_todos.py

      - name: Show README diff and status
        if: always()
        run: |
          git --no-pager diff -- README.md || true
          echo "--- status ---"
          git status --short

      - name: Commit README and remove temporary automation files
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm -f .github/workflows/sync-readme-todos.yml .github/scripts/sync_readme_todos.py .todo_write_test.tmp
          git commit -m "docs: sync README TODO list with dev implementation"
          git push origin HEAD:dev
